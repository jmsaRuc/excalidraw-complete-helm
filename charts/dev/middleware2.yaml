apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: websocket-ingressroute
  namespace: excalidraw-complete
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`excalidraw.helloworld2.net`)
      kind: Rule
      services:
        - kind: Service
          name: excalidraw-complete-excalidraw-complete-helm
          port: 8080
          scheme: http
          serversTransport: websocket-forwarding
          passHostHeader: true
          # Sticky cookie keeps clients on the same backend similar to upstream-hash-by
          sticky:
            cookie:
              name: excalidraw-session
              secure: true
              httpOnly: true
          # WebSocket is auto-detected by Traefik
      middlewares:
        - name: websocket-headers
        - name: websocket-ratelimit
        - name: websocket-circuit-breaker
  tls:
    secretName: excalidraw-complete-tls-secret
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: websocket-headers
  namespace: excalidraw-complete
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: https
    customResponseHeaders:
      X-Frame-Options: SAMEORIGIN
      X-Content-Type-Options: nosniff
    accessControlAllowMethods:
      - GET
      - PUT
      - POST
      - DELETE
      - PATCH
      - OPTIONS
    accessControlAllowOriginList:
      - "*"
      - "http://*"
      - "https://*"
    accessControlAllowHeaders:
      - DNT
      - Keep-Alive
      - User-Agent
      - X-Requested-With
      - If-Modified-Since
      - Cache-Control
      - Content-Type
      - Range
      - Authorization
      - Accept
      - Content-Length
      - X-CSRF-Token
      - Token
      - session
      - Origin
      - Host
      - Connection
      - Accept-Encoding
      - Accept-Language
    accessControlAllowCredentials: true
    accessControlMaxAge: 300
    sslRedirect: true
    sslForceHost: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: websocket-ratelimit
  namespace: excalidraw-complete
spec:
  rateLimit:
    average: 100
    period: 1m
    burst: 50
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: websocket-circuit-breaker
  namespace: excalidraw-complete
spec:
  circuitBreaker:
    expression: ResponseCodeRatio(500, 600, 0, 600) > 0.30
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: websocket-forwarding
  namespace: excalidraw-complete
spec:
  serverName: excalidraw.helloworld2.net
  forwardingTimeouts:
    dialTimeout: 3600s
    responseHeaderTimeout: 3600s
    idleConnTimeout: 3600s