{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "excalidraw-complete.fullname" . }}
  labels:
    {{- include "excalidraw-complete.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "excalidraw-complete.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "excalidraw-complete.selectorLabels" . | nindent 8 }}
    spec:
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ default "latest" .Values.image.tag }}"
        imagePullPolicy: {{ default "IfNotPresent" .Values.image.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.service.port }}
          name: excalidraw-port
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        env:
        - name: STORAGE_TYPE
          value: "postgres"
        - name: VITE_FRONTEND_URL
          value: "{{ .Values.viteFrontendUrl }}"
        - name: ALLOWED_ORIGINS
          value: "{{ .Values.allowedOrigins }}"
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "{{ .Values.service.port }}"
        - name: LOG_LEVEL
          value: "{{ .Values.logLevel }}"
        - name: DEBUG
          value: "{{ default "" .Values.socketDebug }}"
        - name: HA_ACTIVE
          value: "true"
        - name: WEBSOCKET_FIREBASE_HANDLER_URL
          value: "{{ .Values.websocketFirebaseHandlerUrl }}"
        - name: REDIS_HOST
          value: {{ template "excalidraw-complete.redis.host" . }}
        - name: REDIS_PORT
          value: "{{ default "6379" .Values.redis.service.port }}"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
            {{- if .Values.redis.existingSecret }}
              name: {{ .Values.redis.existingSecret }}
            {{- else }}
              name: {{ template "excalidraw-complete.redis.secret" . }}
            {{- end }}
              key: {{ template "excalidraw-complete.redis.secretKey" . }}
        - name: POSTGRES_HOST
          value: {{ template "excalidraw-complete.postgres.host" . }}
        - name: POSTGRES_PORT
          value: "{{ default "5432" .Values.postgres.service.port }}"
        - name: POSTGRES_DB
          value: "{{ default "excalidraw" .Values.postgres.auth.database }}"
        - name: POSTGRES_USER
          value: "{{ default "excalidraw" .Values.postgres.auth.username }}"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
            {{- if .Values.postgres.auth.existingSecret }}
              name: {{ .Values.postgres.auth.existingSecret }}
            {{- else }}
              name: {{ template "excalidraw-complete.postgres.secret" . }}
            {{- end }}
              key: {{ template "excalidraw-complete.postgres.secretKey" . }}
      {{- with .Values.volumeMounts }}
        volumeMounts:
          {{- toYaml . | nindent 10 }}
      {{- end }}
    {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}