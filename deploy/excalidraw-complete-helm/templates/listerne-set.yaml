{{- if .Values.gateway.enabled -}}
{{- if .Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1" -}}
{{- $fullName := include "excalidraw-complete.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
{{- $hostName := .Values.gateway.hostname | quote -}}
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: {{ .Values.gateway.listenerSetNameOverride | default (printf "%s-listener-set" $fullName) }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRef:
    name: {{ .Values.gateway.parentRef.name }}
    kind: Gateway
    namespace: {{ .Values.gateway.parentRef.namespace }}
    group: gateway.networking.k8s.io
  listeners:
  {{- range .Values.gateway.listeners }}
  - name: {{ .name }}
    protocol: {{ .protocol }}
    port: {{ .port }}
    hostname: {{ $hostName }}
    {{- if .tls }}
    tls:
      mode: {{ .tls.mode | default "Terminate" }}
      {{- if .tls.certificateRefs }}
      certificateRefs:
      {{- range .tls.certificateRefs }}
      - kind: Secret
        name: {{ .name }}
        {{- if .namespace }}
        namespace: {{ .namespace }}
        {{- end }}
      {{- end }}
      {{- end }}
    {{- end }}
    {{- if .allowedRoutes }}
    allowedRoutes:
      {{- toYaml .allowedRoutes | nindent 6 }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}