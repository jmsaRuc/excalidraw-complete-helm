# Default values for excalidraw-complete.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
revisionHistoryLimit: 5

image:
  repository: ghcr.io/jmsaruc/excalidraw-complete
  tag: "latest"
  imagePullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# For the vite frontend URL, make sure to include the correct protocol (http or https)
# but tls need to be set in the ingress if https is used.
viteFrontendUrl: "http://excalidraw.minikube.local"

# eksample of allowed origins: "https://eksample.com,https://eksample2.com"
# `viteFrontendUrl` and `websocketFirebaseHandlerUrl` will allways be allowed as origins, remeber to add ws://`websocketFirebaseHandlerUrl no http or https`.
allowedOrigins: "ws://excalidraw.minikube.local"

# If replicaCount > 1, make sure to set `websocketFirebaseHandlerUrl` to a different URL than `viteFrontendUrl`, 
# to not break excalidraws collab functionality.
# Example: 
# viteFrontendUrl: "http://excalidraw.minikube.local"
# websocketFirebaseHandlerUrl: "http://excalidraw-ws-fire-handler.minikube.local"
# the correct protocol also matters for `websocketFirebaseHandlerUrl`(http or https), but can differ from `viteFrontendUrl` protocol.
# but tls need to be set in the ingress if https is used.
# websocketFirebaseHandlerUrl: "http://excalidraw-ws-fire-handler.minikube.local"


# Application log level. One of: "debug", "info", "warning", "error", "fatal", "panic"
logLevel: "info"

socketDebug: ""

readinessProbe:
  httpGet:
    path: /healthz
    port: http

service:
  annotations: 
    traefik.ingress.kubernetes.io/service.passhostheader: "true"
  type: ClusterIP
  port: 8080
  # Annotations applied for services such as externalDNS or
  # service type LoadBalancer
  # type: LoadBalancer
  # httpsPort: 443
  # annotations: {}
  # loadBalancerIP: 172.16.0.1

ingressMain:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: excalidraw.minikube.local
      paths:
        - path: "/"
          pathType: Prefix
  tls: []


# If replicaCount > 1, make sure to enable ingressHashLoadbalancing and set `ingressMain.hosts` to a different URL than `ingressHashLoadbalancing.hosts`, 
# to not break excalidraws collab functionality.
# Example: 
# viteFrontendUrl: "http://excalidraw.minikube.local"
# websocketFirebaseHandlerUrl: "http://excalidraw-ws-fire-handler.minikube.local"
# ingressMain.hosts: excalidraw.minikube.local
# ingressHashLoadbalancing.hosts: excalidraw-ws-fire-handler.minikube.local
ingressHashLoadbalancing:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: excalidraw-ws-fire-handler.minikube.local
      paths:
        - path: "/"
          pathType: Prefix
  tls: []


# Resource requests and limits
resources: {}   
  # requests:
  #   memory: "50Mi"
  #   cpu: "50m"
  # limits:
  #   memory: "100Mi"
  #   cpu: "100m"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

volumeMounts: []

volumes: []

readinessProbe:
  httpGet:
    path: /
    port: excalidraw-port
  initialDelaySeconds: 5
  periodSeconds: 10

## Configuration values for the redis deployment.
redis:
  ## Set to false if bringing your own Redis instance, and add the host under `redis.host`
  enabled: true
  #password: "<redispassword>" # If not set, a random password will be generated
  revisionHistoryLimit: 5

  #host: url of own redis instance if redis.enabled is false default: release-name-redis

  image:
    repository: redis
    tag: "8.2.2-alpine"
    imagePullPolicy: IfNotPresent

  fullnameOverride: ""
  
  startupProbe:
    exec:
      command: ["redis-cli", "ping"]
    failureThreshold: 30

  service:
    port: 6379
    type: ClusterIP

  resources:
    requests:
      memory: "50Mi"
      cpu: "50m"
    limits:
      memory: "100Mi"
      cpu: "100m"

## Configuration values for the postgresql dependency.
## ref: https://github.com/CloudPirates-io/helm-charts/blob/main/charts/postgres/README.md
##
postgres:
  ## Use the PostgreSQL chart dependency.
  ## Set to false if bringing your own PostgreSQL
  enabled: true

  ## host: default release-name-postgres 
  ##
  ## postgresqlPort port for postgres
  ## Default to 5432
  ##
  auth:
    database: excalidraw
    username: admin
    ## Alternatively, you can specify an existing secret
    # existingSecret: excalidraw-complete-secret
    # secretKeys: 
      # passwordKey: postgres-password

  service:
    port: 5432
  ## PostgreSQL fullname Override
  ##
  fullnameOverride: ""
  
  persistence:
    ## Enable PostgreSQL persistence using Persistent Volume Claims.
    ##
    enabled: true
    ## concourse data Persistent Volume Storage Class
    ## If defined, storageClassName: <storageClass>
    ## If set to "-", storageClassName: "", which disables dynamic provisioning
    ## If undefined (the default) or set to null, no storageClassName spec is
    ##   set, choosing the default provisioner.  (gp2 on AWS, standard on
    ##   GKE, AWS & OpenStack)
    ##
    # storageClass: "-"
    ## Persistent Volume Access Mode.
    ##
    accessMode: ReadWriteOnce
    ## Persistent Volume Storage Size.
    ##
    size: 8Gi