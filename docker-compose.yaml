x-excalidraw: &service-excalidraw
  build:
    context: .
    cache_from:
      - ${CACHE_FROM:-type=local,src=./tmp/.buildx-cache}
    cache_to:
      - ${CACHE_TO:-type=local,dest=./tmp/.buildx-cache-app-new,mode=max}
    dockerfile: ./Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
  image: ghcr.io/jmsaruc/excalidraw-complete:${RELEASE_TAG:-latest}
  container_name: excalidraw-complete
  restart: unless-stopped
  ports:
    - "${PORT:-3002}:${PORT:-3002}"
  volumes:
    - db-data:${LOCAL_STORAGE_PATH:-/app/db-data}
  depends_on:
      redis:
        condition: service_healthy
  environment:
    LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/db-data}
    STORAGE_TYPE: ${STORAGE_TYPE:-filesystem}
    VITE_FRONTEND_URL: ${VITE_FRONTEND_URL:-http://localhost:3002}
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-""}
    HOST: ${HOST:-0.0.0.0}
    PORT: ${PORT:-3002}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DATA_SOURCE_NAME: ${DATA_SOURCE_NAME:-excalidraw.db}
    POSTGRES_HOST: ${POSTGRES_HOST:-excalidraw-postgres}
    POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    POSTGRES_USER: ${POSTGRES_USER:-excalidraw}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-excalidraw}
    POSTGRES_DB: ${POSTGRES_DB:-excalidraw}
    DEBUG: ${DEBUG:-""}
    # If ha is true, redis is used as pup/sub and as cache, 
    # so if true use ha-redis profile or all profile or the aplication will faill.
    HA_ACTIVE: ${HA_ACTIVE:-false}
    REDIS_HOST: ${REDIS_HOST:-excalidraw-redis} 
    REDIS_PORT: ${REDIS_PORT:-6379}
    REDIS_PASSWORD: ${REDIS_PASSWORD:-"redispassword"} 
    # If `HA_ACTIVE` is true, and the aplication is deployed using multiple instances/replicas; 
    # `WEBSOCKET_FIREBASE_HANDLER_URL` needs to be different from `VITE_FRONTEND_URL`, to not break excalidraws collab functionality. 
    WEBSOCKET_FIREBASE_HANDLER_URL: ${WEBSOCKET_FIREBASE_HANDLER_URL:-${VITE_FRONTEND_URL:-http://localhost:3002}}
  healthcheck:
    test: ["CMD", "curl", "-f", "${VITE_FRONTEND_URL:-http://localhost:3002}"]
    interval: 30s
    timeout: 3s
    retries: 3
  
services:
  postgres:
    profiles:
      - postgres
      - all
    image: postgres:17.5-alpine3.22
    restart: unless-stopped
    hostname: excalidraw-postgres
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-excalidraw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-excalidraw}
      POSTGRES_DB: ${POSTGRES_DB:-excalidraw}
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U ${POSTGRES_USER:-excalidraw} -d ${POSTGRES_DB:-excalidraw}'"]
      interval: 10s
      timeout: 3s
      retries: 3
    
  redis:
    profiles:
      - ''
      - ha-redis
      - all
    image: redis:8.2.2-alpine
    restart: always
    hostname: excalidraw-redis
    command: 
      - /bin/sh
      - -c
      - redis-server --requirepass "$${REDIS_PASSWORD:-"redispassword"}"
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-"redispassword"}
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 10

  excalidraw-complete:
    profiles:
      - ''
    <<: *service-excalidraw
  
  excalidraw-complete-postgres:
    profiles:
      - postgres
    <<: *service-excalidraw
    depends_on:
      postgres:
        condition: service_healthy
  
  excalidraw-complete-ha-redis:
    profiles:
      - ha-redis
    <<: *service-excalidraw
    depends_on:
      redis:
        condition: service_healthy
  
  excalidraw-complete-all:
    profiles:
      - all
    <<: *service-excalidraw
    depends_on:
      postgres:
        condition: service_healthy
      redis: 
        condition: service_healthy

volumes:
  db-data: 
  pg-data:
