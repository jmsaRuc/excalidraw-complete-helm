name: "Publish charts to repo"
on:
  push:
    tags:
      - "chart-**"
    paths:
      - "deploy/**"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: update helm dep
        run: helm dependency update deploy/excalidraw-complete-helm
      - name: run lint
        run: helm lint deploy/excalidraw-complete-helm
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: deploy
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"