on:
  push:
    tags: 
        - '*.*.*-dev'  # Match semantic version tags like 1.0.0, 2.1.3, etc.

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }} # Don't use github.ref_name
        restore-keys: |
          ${{ runner.os }}-buildx-main
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Set tag variable
      run: echo "DEV_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
    - name: Build and push tag
      run: CACHE_TO="type=local,dest=/tmp/.buildx-cache-main-new,mode=max" CACHE_FROM="type=local,src=/tmp/.buildx-cache-main" COMPOSE_DOCKER_CLI_BUILD=1 DOCKER_BUILDKIT=1 RELEASE_TAG=${{ env.DEV_TAG }} docker compose build --push
    - name: APP::Move cache
      run: |
        rm -rf /tmp/.buildx-cache-main         # Remove the old cache.
        mv /tmp/.buildx-cache-main-new /tmp/.buildx-cache-main  # Move the new cache to replace the old cache.